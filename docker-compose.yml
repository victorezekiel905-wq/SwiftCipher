version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: classesphere
      POSTGRES_USER: classesphere
      POSTGRES_PASSWORD: classesphere
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: classesphere
      MINIO_ROOT_PASSWORD: classesphere123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://classsphere:classsphere@postgres:5432/classsphere?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: access-secret-change-me
      JWT_REFRESH_SECRET: refresh-secret-change-me
      PORT: 4000
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: classsphere-assets
      STORAGE_ACCESS_KEY: classsphere
      STORAGE_SECRET_KEY: classsphere123
      STORAGE_FORCE_PATH_STYLE: "true"
    depends_on: [postgres, redis, minio]
    ports: ["4000:4000"]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  pgdata:
  minio:
