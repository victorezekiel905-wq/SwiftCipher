apiVersion: apps/v1
kind: Deployment
metadata:
  name: classesphere-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: classesphere-api
  template:
    metadata:
      labels:
        app: classesphere-api
    spec:
      containers:
        - name: api
          image: classesphere/api:latest
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: '4000'
